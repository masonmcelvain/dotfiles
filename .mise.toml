# Dev tools for working on this repo, not tools the dotfiles install. Run
# `mise install` once, then `mise run lint` and `mise run test` (defined in
# .mise/tasks/).
# chezmoi ignores this file and that directory because their names start
# with a dot.

[tools]
shellcheck = "0.11.0"
# Renders the shell templates for the lint task.
chezmoi = "2.73.0"
# Builds and checks mm; chezmoi apply builds it with the host's own go.
go = "1.26.8"
staticcheck = "2026.2.1"

# `mise run lint` runs every linter in .mise/tasks/lint/.
[tasks.lint]
description = "Run every linter"
depends = ["lint:*"]
