name: Shell

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    env:
      # Only install what this job uses; mise would otherwise fetch every
      # tool in .mise.toml before running the task.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: shellcheck chezmoi
      - run: mise run lint:shell
